<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4DA2">
<title>¿Dónde está mi auto?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --display: "Barlow Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", system-ui, sans-serif;
    --text: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sign: #0A4DA2;
    --bg: #EEF0F3; --panel: #FFFFFF; --ink: #15181E; --muted: #566070; --line: #CBD0D8;
    --prime: #15181E; --prime-ink: #FFFFFF; --link: #0A4DA2; --focus: #0A4DA2; --danger: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1218; --panel: #171B23; --ink: #EDEFF2; --muted: #9AA3B2; --line: #2B3342;
      --prime: #EDEFF2; --prime-ink: #0F1218; --link: #8DB8FF; --focus: #FFC20E; --danger: #FF8A80;
    }
    .leaflet-tile-pane { filter: brightness(.85) contrast(1.05); }
    body {
      background-image:
        radial-gradient(ellipse 140% 35% at 50% 0%, rgba(10,77,162,.28) 0%, transparent 100%),
        radial-gradient(var(--line) 1.5px, transparent 1.5px);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 140% 35% at 50% 0%, rgba(10,77,162,.13) 0%, transparent 100%),
      radial-gradient(var(--line) 1.5px, transparent 1.5px);
    background-size: auto, 28px 28px;
    color: var(--ink);
    font: 500 1.0625rem/1.4 var(--text);
  }
  main { max-width: 480px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  h1 { font: 700 1.9rem/1.05 var(--display); margin: 8px 0 20px; }
  h2 { font: 700 1.35rem/1.1 var(--display); margin: 0 0 4px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: .95rem; }

  /* Main action: a parking sign */
  .sign { position: relative; display: flex; align-items: center; gap: 16px; width: 100%;
    min-height: 100px; padding: 18px 22px; border: 0; border-radius: 16px;
    background: linear-gradient(160deg, #1560C0 0%, #0A4DA2 60%, #083D80 100%);
    color: #fff; cursor: pointer; text-align: left;
    font: 700 1.9rem/1.05 var(--display); }
  .sign:not(:disabled):hover { background: linear-gradient(160deg, #1D6FD4 0%, #1259B8 60%, #0A4DA2 100%); }
  .sign::after { content: ""; position: absolute; inset: 6px; border: 2px solid rgba(255,255,255,.9);
    border-radius: 11px; pointer-events: none; }
  .sign:focus-visible { outline-offset: 4px; }
  .roundel { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #fff; color: var(--sign);
    display: grid; place-items: center; font: 700 2.2rem/1 var(--display); }
  .sign:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 12px; color: var(--muted); font-size: .95rem; }
  #status:empty { display: none; }
  #status.error { color: var(--danger); }

  /* Current spot */
  .spot { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .when { font: 700 1.75rem/1.1 var(--display); margin: 2px 0; }
  .distance { font: 700 2.7rem/1 var(--display); margin-top: 20px; }
  .distance:empty, #distNote:empty { display: none; }
  #distNote { margin-top: 4px; }
  #map { height: 260px; margin-top: 16px; border-radius: 14px; border: 1px solid var(--line); }
  .carpin { width: 30px; height: 30px; border-radius: 50%; background: var(--sign); color: #fff;
    border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
    font: 700 16px/1 var(--display); box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .disttip { font-weight: 700; }

  .actions { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row > .btn { flex: 1; }
  .btn { font: 600 1rem/1.2 var(--text); min-height: 48px; padding: 10px 16px; border-radius: 10px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .btn:not(:disabled):hover { background: rgba(0,0,0,.05); }
  .btn.primary { min-height: 56px; background: var(--sign); border-color: var(--sign);
    color: #fff; font-size: 1.15rem; }
  .btn.primary:not(:disabled):hover { background: #1259B8; border-color: #1259B8; }
  .btn:disabled { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: no-preference) {
    .sign, .btn { transition: transform .08s ease-out, background .12s ease-out; }
    .sign:active, .btn:active { transform: translateY(1px); }
  }
  @media (prefers-color-scheme: dark) {
    .btn:not(:disabled):hover { background: rgba(255,255,255,.07); }
  }

  .extras { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .noteRow { display: flex; gap: 10px; }
  .noteRow input { flex: 1; min-width: 0; }
  input[type=text] { font: inherit; min-height: 48px; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text]:focus-visible { outline-offset: 1px; border-color: var(--focus); }
  input[type=file] { display: none; }
  #photo { display: block; width: 100%; border-radius: 12px; }

  #historyWrap { margin-top: 32px; }
  ul { list-style: none; margin: 0; padding: 0; }
  #history li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  #history li .note { display: block; color: var(--muted); font-weight: 500; font-size: .9rem; }
  #history li a { color: var(--link); font-weight: 600; min-height: 44px; padding: 0 4px;
    display: inline-flex; align-items: center; }
  .link { background: none; border: 0; padding: 12px 0; min-height: 44px; color: var(--muted);
    text-decoration: underline; font: inherit; font-size: .95rem; cursor: pointer; }
  .foot { margin-top: 28px; color: var(--muted); font-size: .9rem; }

  /* Feature: address display */
  .addr { font: 600 1.05rem/1.3 var(--display); margin: 4px 0 2px; color: var(--ink); min-height: 1.2em; }

  /* Feature: parking timer */
  .timer-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .timer-label { font: 700 .85rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .timer-row { display: flex; gap: 8px; }
  .timer-btn { flex: 1; font-size: .9rem !important; min-height: 40px !important; }
  #timerDisplay { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 12px; }
  #timerCount { font: 700 1.6rem/1 var(--display); }
  #timerCount.urgent { color: var(--danger); }
  #timerNote { font-size: .8rem; color: var(--muted); margin-top: 8px; }

  /* Feature: compass overlay */
  #compassOverlay {
    position: fixed; inset: 0; z-index: 5000;
    background: #0A0E17;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  #compassOverlay[hidden] { display: none !important; }
  #compassClose { position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px; }
  #compassArrowWrap {
    width: 180px; height: 180px; border-radius: 50%;
    background: linear-gradient(160deg, #1560C0, #0A4DA2);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 48px rgba(10,77,162,.55);
  }
  #compassArrowSvg { width: 72px; height: 72px; transition: transform .12s ease-out; }
  #compassDist { font: 700 3rem/1 var(--display); color: #EDEFF2; text-align: center; }
  #compassAddr { font: 500 .95rem/1.4 var(--text); color: #8DB8FF; text-align: center; max-width: 280px; }
  #compassErr { color: #9AA3B2; text-align: center; max-width: 280px; font-size: .9rem; }

  #offline-banner {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    background: rgba(21,24,30,.93); color: #EDEFF2;
    font: 600 .875rem/1.3 var(--text);
    padding: 10px 20px; border-radius: 24px; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,.35); z-index: 9000;
  }
</style>
</head>
<body>
<div id="offline-banner" hidden>📡 Sin conexión — mostrando datos guardados</div>
<main>
  <h1>¿Dónde está mi auto?</h1>

  <button id="save" class="sign" type="button">
    <span class="roundel" aria-hidden="true">P</span>
    <span>Estacioné mi auto aquí</span>
  </button>
  <div id="status" role="status" aria-live="polite"></div>

  <section class="spot" id="current" hidden>
    <p class="muted">Último lugar guardado</p>
    <p class="when" id="when"></p>
    <p class="addr" id="addr"></p>
    <p class="muted" id="acc"></p>

    <p id="dist" class="distance" aria-live="polite"></p>
    <p id="distNote" class="muted"></p>
    <div id="map" role="img" aria-label="Mapa con la ubicación de tu auto" hidden></div>

    <div class="actions">
      <button id="go" class="btn primary" type="button">🗺️ Ir hasta mi auto</button>
      <div class="row">
        <button id="distBtn" class="btn" type="button">🚶 Distancia</button>
        <button id="compassBtn" class="btn" type="button">🧭 Brújula</button>
        <button id="share" class="btn" type="button">📤 Compartir</button>
      </div>
    </div>

    <div class="timer-section" id="timerSection" hidden>
      <p class="timer-label">⏱ Alarma de estacionamiento</p>
      <div class="timer-row">
        <button class="btn timer-btn" data-min="30">30m</button>
        <button class="btn timer-btn" data-min="60">1h</button>
        <button class="btn timer-btn" data-min="120">2h</button>
        <button class="btn timer-btn" data-min="180">3h</button>
      </div>
      <div id="timerDisplay" hidden>
        <span id="timerCount"></span>
        <button id="timerCancel" class="btn">✕ Cancelar</button>
      </div>
      <p id="timerNote" class="muted" hidden>Funciona mientras la app esté abierta o en segundo plano.</p>
    </div>

    <div class="extras">
      <div class="noteRow">
        <input type="text" id="note" maxlength="120" placeholder="Nota, p. ej. Nivel -2, cerca del ascensor" aria-label="Nota para este lugar">
        <button id="saveNote" class="btn" type="button">✓ Guardar</button>
      </div>
      <img id="photo" alt="Foto de dónde está estacionado el auto" hidden>
      <div class="row">
        <button id="takePhoto" class="btn" type="button">Hacer foto</button>
        <button id="removePhoto" class="btn" type="button" hidden>Quitar foto</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment">
    </div>
  </section>

  <section id="historyWrap" hidden>
    <h2>Lugares anteriores</h2>
    <ul id="history"></ul>
    <button id="clear" class="link" type="button">Borrar todo</button>
  </section>

  <p class="foot">🔒 Tus lugares, notas y fotos se guardan solo en este teléfono.</p>
</main>

<!-- Compass fullscreen overlay -->
<div id="compassOverlay" hidden>
  <button id="compassClose" class="btn" type="button">✕ Cerrar</button>
  <div id="compassArrowWrap">
    <svg id="compassArrowSvg" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="36,6 44,56 36,48 28,56" fill="white" opacity=".95"/>
      <polygon points="36,66 44,16 36,24 28,16" fill="white" opacity=".3"/>
    </svg>
  </div>
  <p id="compassDist"></p>
  <p id="compassAddr"></p>
  <p id="compassErr"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var KEY = "carSpots";
  var MAX = 10;
  var $ = function (id) { return document.getElementById(id); };
  var saveBtn = $("save");
  var statusEl = $("status");
  var watchId = null;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function store(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
           " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function navUrl(s) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng +
           "&travelmode=walking";
  }
  function viewUrl(s) {
    return "https://www.google.com/maps/search/?api=1&query=" + s.lat + "," + s.lng;
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.className = isError ? "error" : "muted";
  }
  function meters(a, b, c, d) {
    var R = 6371000, t = Math.PI / 180;
    var dLat = (c - a) * t, dLon = (d - b) * t;
    var x = Math.pow(Math.sin(dLat / 2), 2) +
            Math.cos(a * t) * Math.cos(c * t) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function fmtDist(m) {
    return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
  }

  var map = null, carMarker = null, userMarker = null, trackLine = null;
  var notifiedClose = false;
  var timerTimeout = null, timerInterval = null;
  var compassWatch = null, compassHeading = 0, compassBearing = 0;
  var shownTs = null, fitted = 0;
  var lastFix = null, routing = false;
  var lastRoute = { t: 0, lat: null, lng: null, spotTs: null, dist: null, coords: null, failed: false };

  function clearTrack() {
    if (!map) return;
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (trackLine) { map.removeLayer(trackLine); trackLine = null; }
  }

  function showMap(spot) {
    var el = $("map");
    if (typeof L === "undefined") { el.hidden = true; return; }
    el.hidden = false;
    var ll = [spot.lat, spot.lng];
    if (!map) {
      map = L.map(el);
      map.setView(ll, 17);
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var mbStyle = dark ? 'navigation-night-v1' : 'navigation-day-v1';
      L.tileLayer(
        'https://api.mapbox.com/styles/v1/mapbox/' + mbStyle + '/tiles/{z}/{x}/{y}@2x?access_token=pk.eyJ1IjoiemVyb3NkYiIsImEiOiJjbXZuOTRvMWwwZTRxMzZwdW44YWRqazU2In0.32Pdfthe9DWfVkP05f4ohw',
        { maxZoom: 19, tileSize: 512, zoomOffset: -1,
          attribution: '&copy; <a href="https://www.mapbox.com/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>' }
      ).addTo(map);
    }
    if (!carMarker) {
      carMarker = L.marker(ll, {
        icon: L.divIcon({ className: "", html: '<div class="carpin">P</div>',
                          iconSize: [30, 30], iconAnchor: [15, 15] })
      }).addTo(map);
    } else {
      carMarker.setLatLng(ll);
    }
    map.invalidateSize();
    if (shownTs !== spot.ts) {
      shownTs = spot.ts; fitted = 0; clearTrack(); map.setView(ll, 17);
    }
  }

  function updateTrack(userLL, spot, label, routeCoords) {
    if (!map || typeof L === "undefined") return;
    var carLL = [spot.lat, spot.lng];
    if (!userMarker) {
      userMarker = L.circleMarker(userLL, { radius: 8, color: "#ffffff", weight: 3,
        fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map);
    } else {
      userMarker.setLatLng(userLL);
    }
    if (trackLine) map.removeLayer(trackLine);
    var hasRoute = routeCoords && routeCoords.length > 1;
    var pts = hasRoute ? routeCoords : [userLL, carLL];
    var opts = hasRoute ? { color: "#1a73e8", weight: 4 }
                        : { color: "#1a73e8", weight: 3, dashArray: "6 8" };
    trackLine = L.polyline(pts, opts).addTo(map);
    trackLine.bindTooltip(label, { permanent: true, direction: "center", className: "disttip" });
    var want = hasRoute ? 2 : 1;
    if (fitted < want) {
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 18 });
      fitted = want;
    }
  }

  /* Walking route (public OSM/FOSSGIS foot router). Falls back to straight-line distance. */
  function fetchRoute(from, spot, done) {
    var url = "https://routing.openstreetmap.de/routed-foot/route/v1/foot/" +
      from[1] + "," + from[0] + ";" + spot.lng + "," + spot.lat +
      "?overview=full&geometries=geojson";
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 8000);
    fetch(url, { signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
      .then(function (j) {
        clearTimeout(to);
        if (!j.routes || !j.routes.length) throw new Error("noroute");
        var r0 = j.routes[0];
        done({
          dist: r0.distance,
          coords: r0.geometry.coordinates.map(function (c) { return [c[1], c[0]]; })
        });
      })
      .catch(function () { clearTimeout(to); done(null); });
  }

  function showDistance() {
    if (!lastFix) return;
    var haveRoute = lastRoute.spotTs === lastFix.spot.ts && lastRoute.dist != null;
    var label, text, note = "";
    if (haveRoute) {
      label = fmtDist(lastRoute.dist);
      text = label + " a pie";
    } else {
      label = fmtDist(lastFix.straight);
      text = label;
      note = "En línea recta.";
      if (lastRoute.failed) note += " No se pudo calcular la ruta a pie.";
      else if (routing) note += " Calculando la ruta a pie…";
    }
    $("dist").textContent = text;
    $("distNote").textContent = note;
    updateTrack(lastFix.ll, lastFix.spot, label, haveRoute ? lastRoute.coords : null);
  }

  function stopWatch() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    $("distBtn").textContent = "🚶 Ver distancia";
    $("dist").textContent = "";
    $("distNote").textContent = "";
    fitted = 0;
    lastFix = null; routing = false;
    notifiedClose = false;
    lastRoute = { t: 0, lat: null, lng: null, spotTs: null, dist: null, coords: null, failed: false };
    clearTrack();
    var cur = load()[0];
    if (map && cur) map.setView([cur.lat, cur.lng], 17);
  }

  /* ── Geocoding ────────────────────────────────────────── */
  function geocodeSpot(spot) {
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + spot.lat + '&lon=' + spot.lng, {
      headers: { 'Accept-Language': 'es', 'User-Agent': 'DondeEstaMiAuto/1.0' }
    })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(j) {
      if (!j) return;
      var a = j.address || {};
      var road = a.road || a.pedestrian || a.path || a.footway || '';
      var num  = a.house_number ? ' ' + a.house_number : '';
      var sub  = a.suburb || a.neighbourhood || a.city_district || '';
      var city = a.city || a.town || a.village || a.municipality || '';
      var parts = [road + num, sub, city].filter(Boolean);
      var addr = parts.length ? parts.join(', ') : (j.display_name || '').split(',').slice(0, 2).join(',').trim();
      if (!addr) return;
      var list = load();
      if (list.length && list[0].ts === spot.ts) {
        list[0].address = addr;
        store(list);
        var addrEl = $('addr');
        if (addrEl) addrEl.textContent = addr;
      }
    })
    .catch(function() {});
  }

  /* ── Notifications ────────────────────────────────────── */
  function requestNotifPerm(cb) {
    if (!('Notification' in window)) { cb(false); return; }
    if (Notification.permission === 'granted') { cb(true); return; }
    Notification.requestPermission().then(function(p) { cb(p === 'granted'); });
  }

  /* ── Parking timer ────────────────────────────────────── */
  function clearTimer() {
    if (timerTimeout) { clearTimeout(timerTimeout); timerTimeout = null; }
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    localStorage.removeItem('carTimer');
    renderTimer();
  }

  function armTimer(end, canNotify) {
    if (timerTimeout) clearTimeout(timerTimeout);
    if (timerInterval) clearInterval(timerInterval);
    var remaining = end - Date.now();
    if (remaining <= 0) { clearTimer(); return; }
    timerInterval = setInterval(renderTimer, 1000);
    if (canNotify) {
      timerTimeout = setTimeout(function() {
        new Notification('⏰ Estacionamiento', { body: 'Tu tiempo está por vencer', icon: './icon-192.png' });
        clearTimer();
      }, remaining);
    }
    renderTimer();
  }

  function startTimer(ms) {
    clearTimer();
    requestNotifPerm(function(ok) {
      var end = Date.now() + ms;
      localStorage.setItem('carTimer', JSON.stringify({ end: end }));
      armTimer(end, ok);
    });
  }

  function renderTimer() {
    var sec = $('timerSection'), disp = $('timerDisplay'), cnt = $('timerCount'), note = $('timerNote');
    if (!sec) return;
    var list = load();
    sec.hidden = !list.length;
    if (!list.length) return;
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('carTimer')); } catch(e) {}
    if (!stored || Date.now() >= stored.end) { disp.hidden = true; if (note) note.hidden = true; return; }
    disp.hidden = false;
    if (note) note.hidden = false;
    var rem = Math.max(0, stored.end - Date.now());
    var h = Math.floor(rem / 3600000);
    var m = Math.floor((rem % 3600000) / 60000);
    var s = Math.floor((rem % 60000) / 1000);
    cnt.textContent = '⏱ ' + (h > 0 ? pad(h) + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s));
    cnt.className = rem < 600000 ? 'urgent' : '';
  }

  /* ── Direction compass ────────────────────────────────── */
  function toRad(d) { return d * Math.PI / 180; }
  function calcBearing(from, to) {
    var dLon = toRad(to.lng - from.lng);
    var lat1 = toRad(from.lat), lat2 = toRad(to.lat);
    var y = Math.sin(dLon) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function updateCompassArrow() {
    var svg = $('compassArrowSvg');
    if (!svg) return;
    var rot = (compassBearing - compassHeading + 360) % 360;
    svg.style.transform = 'rotate(' + rot + 'deg)';
  }

  function onDeviceOrientation(e) {
    var h = (e.webkitCompassHeading != null) ? e.webkitCompassHeading : (360 - (e.alpha || 0));
    compassHeading = h;
    updateCompassArrow();
  }

  function openCompass() {
    var list = load();
    if (!list.length) { setStatus('No hay ningún lugar guardado.', true); return; }
    var spot = list[0];
    var overlay = $('compassOverlay');
    overlay.hidden = false;
    $('compassDist').textContent = 'Localizando…';
    $('compassAddr').textContent = spot.address || '';
    $('compassErr').textContent = '';

    var startOrientation = function() {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
    };
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(function(r) {
          if (r === 'granted') startOrientation();
          else $('compassErr').textContent = 'Permiso de brújula denegado en Ajustes.';
        })
        .catch(function() { $('compassErr').textContent = 'No se pudo acceder a la brújula.'; });
    } else if (window.DeviceOrientationEvent) {
      startOrientation();
    } else {
      $('compassErr').textContent = 'Tu dispositivo no tiene brújula.';
    }

    compassWatch = navigator.geolocation.watchPosition(function(pos) {
      var here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      compassBearing = calcBearing(here, spot);
      $('compassDist').textContent = fmtDist(meters(here.lat, here.lng, spot.lat, spot.lng));
      updateCompassArrow();
    }, function() {
      $('compassErr').textContent = 'No se pudo obtener tu posición.';
    }, { enableHighAccuracy: true, maximumAge: 2000 });
  }

  function closeCompass() {
    $('compassOverlay').hidden = true;
    window.removeEventListener('deviceorientation', onDeviceOrientation, true);
    if (compassWatch !== null) { navigator.geolocation.clearWatch(compassWatch); compassWatch = null; }
  }

  /* ── Share card (Canvas) ──────────────────────────────── */
  function shareCard(s) {
    var mapsUrl = 'https://maps.google.com/maps?q=' + s.lat + ',' + s.lng;
    var text = '📍 Mi auto está acá:\n' + mapsUrl;
    if (s.address) text += '\n' + s.address;
    if (s.note) text += '\n(' + s.note + ')';
    if (navigator.share) {
      navigator.share({ title: '¿Dónde está mi auto?', text: text, url: mapsUrl }).catch(function() {});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  }

  function render() {
    var list = load();
    var current = $("current");
    var wrap = $("historyWrap");
    var ul = $("history");
    ul.innerHTML = "";

    if (!list.length) { stopWatch(); current.hidden = true; wrap.hidden = true; return; }

    var last = list[0];
    current.hidden = false;
    $("when").textContent = fmt(last.ts);
    $("addr").textContent = last.address || '';
    $("acc").textContent = last.acc ? "Precisión de unos " + Math.round(last.acc) + " m" : "";
    if (document.activeElement !== $("note")) $("note").value = last.note || "";

    var img = $("photo");
    if (last.photo) { img.src = last.photo; img.hidden = false; }
    else { img.removeAttribute("src"); img.hidden = true; }
    $("removePhoto").hidden = !last.photo;
    $("takePhoto").textContent = last.photo ? "📸 Repetir foto" : "📸 Hacer foto";
    showMap(last);
    renderTimer();

    var older = list.slice(1);
    wrap.hidden = !older.length;
    older.forEach(function (s) {
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = "📍 " + (s.address ? s.address + ' · ' + fmt(s.ts) : fmt(s.ts));
      if (s.note) {
        var n = document.createElement("span");
        n.className = "note";
        n.textContent = s.note;
        span.appendChild(n);
      }
      var a = document.createElement("a");
      a.href = navUrl(s); a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Ir";
      li.appendChild(span); li.appendChild(a);
      ul.appendChild(li);
    });
  }

  /* Save spot */
  saveBtn.addEventListener("click", function () {
    if (!("geolocation" in navigator)) {
      setStatus("Este navegador no admite GPS.", true); return;
    }
    saveBtn.disabled = true;
    setStatus("Obteniendo posición GPS…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      var list = load();
      list.unshift({
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        acc: pos.coords.accuracy, ts: Date.now()
      });
      list = list.slice(0, MAX);
      /* Photos are kept only for the latest spot to save storage */
      list.forEach(function (s, i) { if (i > 0) delete s.photo; });
      $("note").value = "";
      if (store(list)) setStatus("Guardado. Puedes añadir una nota o una foto.");
      else setStatus("No se pudo guardar. Comprueba que el navegador permita el almacenamiento del sitio.", true);
      saveBtn.disabled = false;
      render();
      geocodeSpot(list[0]);
    }, function (err) {
      var msg = "No se pudo obtener tu posición.";
      if (err.code === 1) msg = "Permiso de ubicación denegado. Permite la ubicación para este sitio en los ajustes de Chrome.";
      else if (err.code === 2) msg = "Posición no disponible. Activa el GPS e inténtalo de nuevo.";
      else if (err.code === 3) msg = "El GPS tardó demasiado. Sal a un lugar abierto e inténtalo de nuevo.";
      setStatus(msg, true);
      saveBtn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });

  /* Note */
  function saveNote() {
    var list = load();
    if (!list.length) return;
    list[0].note = $("note").value.trim();
    if (store(list)) setStatus("Nota guardada.");
    else setStatus("No se pudo guardar la nota. Comprueba el almacenamiento del navegador.", true);
    render();
  }
  $("saveNote").addEventListener("click", saveNote);
  $("note").addEventListener("change", saveNote);

  /* Photo */
  $("takePhoto").addEventListener("click", function () { $("photoInput").click(); });
  $("photoInput").addEventListener("change", function () {
    var input = $("photoInput");
    var f = input.files && input.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      var max = 800;
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(url);
      var list = load();
      if (list.length) {
        list[0].photo = data;
        if (store(list)) setStatus("Foto guardada.");
        else setStatus("No hay espacio suficiente en el navegador para la foto.", true);
      }
      input.value = "";
      render();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus("No se pudo leer esa foto.", true);
      input.value = "";
    };
    img.src = url;
  });
  $("removePhoto").addEventListener("click", function () {
    var list = load();
    if (list.length) { delete list[0].photo; store(list); }
    setStatus("Foto quitada.");
    render();
  });

  /* Navigate */
  $("go").addEventListener("click", function () {
    var list = load();
    if (list.length) window.open(navUrl(list[0]), "_blank");
  });

  /* Share */
  $("share").addEventListener("click", function () {
    var list = load();
    if (!list.length) return;
    shareCard(list[0]);
  });

  /* Live distance */
  $("distBtn").addEventListener("click", function () {
    if (watchId !== null) { stopWatch(); return; }
    var list = load();
    if (!list.length) return;
    if (!("geolocation" in navigator)) {
      setStatus("Este navegador no admite GPS.", true); return;
    }
    var spot = list[0];
    $("distBtn").textContent = "⏹ Detener distancia";
    $("dist").textContent = "Localizando…";
    watchId = navigator.geolocation.watchPosition(function (pos) {
      var cur = load()[0] || spot;
      var here = [pos.coords.latitude, pos.coords.longitude];
      lastFix = { ll: here, spot: cur, straight: meters(here[0], here[1], cur.lat, cur.lng) };

      var moved = lastRoute.lat === null ||
                  meters(here[0], here[1], lastRoute.lat, lastRoute.lng) > 20;
      var stale = lastRoute.spotTs !== cur.ts || moved;
      if (!routing && stale && Date.now() - lastRoute.t > 8000) {
        routing = true;
        lastRoute.t = Date.now();
        fetchRoute(here, cur, function (res) {
          routing = false;
          if (watchId === null) return;
          lastRoute.lat = here[0]; lastRoute.lng = here[1]; lastRoute.spotTs = cur.ts;
          lastRoute.dist = res ? res.dist : null;
          lastRoute.coords = res ? res.coords : null;
          lastRoute.failed = !res;
          showDistance();
        });
      }
      showDistance();
      if (lastFix.straight < 300 && !notifiedClose && Notification.permission === 'granted') {
        notifiedClose = true;
        new Notification('🚗 Tu auto está cerca', { body: 'A menos de 300 m — ya casi llegas' });
      }
    }, function (err) {
      stopWatch();
      setStatus(err.code === 1 ? "Permiso de ubicación denegado." : "No se pudo obtener tu posición.", true);
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  });

  /* Clear */
  $("clear").addEventListener("click", function () {
    if (confirm("¿Borrar todos los lugares guardados?")) { stopWatch(); store([]); setStatus(""); render(); }
  });

  /* Offline indicator */
  function updateOfflineBanner() {
    var b = $("offline-banner");
    if (b) b.hidden = navigator.onLine;
  }
  window.addEventListener('online', updateOfflineBanner);
  window.addEventListener('offline', updateOfflineBanner);
  updateOfflineBanner();

  /* Timer buttons */
  document.querySelectorAll('.timer-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      startTimer(parseInt(btn.dataset.min, 10) * 60 * 1000);
    });
  });
  $('timerCancel').addEventListener('click', clearTimer);

  /* Compass */
  $('compassBtn').addEventListener('click', openCompass);
  $('compassClose').addEventListener('click', closeCompass);

  render();

  /* Re-arm timer from localStorage on load */
  (function rearmTimer() {
    var saved = localStorage.getItem('carTimer');
    if (!saved) return;
    var t = JSON.parse(saved);
    var remaining = t.end - Date.now();
    if (remaining > 0) armTimer(t.end, true);
    else localStorage.removeItem('carTimer');
  })();

  /* PWA shortcut handling */
  (function handleShortcut() {
    var action = new URLSearchParams(location.search).get('action');
    if (action === 'save') {
      setTimeout(function() { $('save').click(); }, 500);
    } else if (action === 'view') {
      var cur = document.getElementById('current');
      if (cur) cur.scrollIntoView({ behavior: 'smooth' });
    }
  })();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
