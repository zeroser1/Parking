<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>¿Dónde está mi auto?</title>
<style>
  :root {
    --bg: #f5f3ee; --ink: #14213d; --muted: #5b6475; --line: #d9d5ca;
    --accent: #14213d; --accent-ink: #ffffff; --warn: #a4372b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101522; --ink: #f1efe8; --muted: #9aa3b5; --line: #26304a;
            --accent: #f1efe8; --accent-ink: #101522; --warn: #ff8a7a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  button { font: inherit; border-radius: 12px; border: 2px solid var(--accent);
    padding: 14px; width: 100%; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-ink); font-size: 1.2rem; font-weight: 700; padding: 16px; }
  .secondary { background: transparent; color: var(--ink); font-weight: 600; margin-top: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 12px; }
  .current { margin: 24px 0 8px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
  .current p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  #status { min-height: 1.4em; margin-top: 12px; }
  #status.error { color: var(--warn); }
  #dist { font-size: 1.3rem; font-weight: 700; margin: 12px 0 0; }
  input[type=text] { font: inherit; width: 100%; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); margin-top: 12px; }
  #photo { display: block; width: 100%; border-radius: 12px; margin-top: 12px; }
  h2 { font-size: 1rem; margin: 28px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line); }
  li a { color: var(--ink); font-weight: 600; white-space: nowrap; }
  li .note { display: block; color: var(--muted); font-size: .85rem; }
  .link { background: none; border: none; width: auto; padding: 4px 0; color: var(--muted);
    text-decoration: underline; font-size: .9rem; margin-top: 12px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>¿Dónde está mi auto?</h1>

  <button id="save" class="primary">Estacioné mi auto aquí</button>
  <div id="status" class="muted" role="status" aria-live="polite"></div>

  <section class="current" id="current" hidden>
    <p class="muted">Último lugar guardado</p>
    <p id="when"></p>
    <p class="muted" id="acc"></p>

    <input type="text" id="note" maxlength="120" placeholder="Nota, p. ej. Nivel -2, cerca del ascensor" aria-label="Nota para este lugar">
    <button id="saveNote" class="secondary">Guardar nota</button>

    <img id="photo" alt="Foto de dónde está estacionado el auto" hidden>
    <div class="row">
      <button id="takePhoto" class="secondary">Hacer foto</button>
      <button id="removePhoto" class="secondary" hidden>Quitar foto</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment">

    <button id="go" class="secondary">Ir hasta mi auto</button>
    <button id="share" class="secondary">Compartir ubicación</button>
    <button id="distBtn" class="secondary">Ver distancia hasta mi auto</button>
    <p id="dist" aria-live="polite"></p>
  </section>

  <section id="historyWrap" hidden>
    <h2>Lugares anteriores</h2>
    <ul id="history"></ul>
    <button id="clear" class="link">Borrar todo</button>
  </section>
</main>

<script>
(function () {
  var KEY = "carSpots";
  var MAX = 10;
  var $ = function (id) { return document.getElementById(id); };
  var saveBtn = $("save");
  var statusEl = $("status");
  var watchId = null;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function store(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
           " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function navUrl(s) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng +
           "&travelmode=walking";
  }
  function viewUrl(s) {
    return "https://www.google.com/maps/search/?api=1&query=" + s.lat + "," + s.lng;
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.className = isError ? "error" : "muted";
  }
  function meters(a, b, c, d) {
    var R = 6371000, t = Math.PI / 180;
    var dLat = (c - a) * t, dLon = (d - b) * t;
    var x = Math.pow(Math.sin(dLat / 2), 2) +
            Math.cos(a * t) * Math.cos(c * t) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function fmtDist(m) {
    return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
  }

  function stopWatch() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    $("distBtn").textContent = "Ver distancia hasta mi auto";
    $("dist").textContent = "";
  }

  function render() {
    var list = load();
    var current = $("current");
    var wrap = $("historyWrap");
    var ul = $("history");
    ul.innerHTML = "";

    if (!list.length) { stopWatch(); current.hidden = true; wrap.hidden = true; return; }

    var last = list[0];
    current.hidden = false;
    $("when").textContent = fmt(last.ts);
    $("acc").textContent = last.acc ? "Precisión de unos " + Math.round(last.acc) + " m" : "";
    if (document.activeElement !== $("note")) $("note").value = last.note || "";

    var img = $("photo");
    if (last.photo) { img.src = last.photo; img.hidden = false; }
    else { img.removeAttribute("src"); img.hidden = true; }
    $("removePhoto").hidden = !last.photo;
    $("takePhoto").textContent = last.photo ? "Repetir foto" : "Hacer foto";

    var older = list.slice(1);
    wrap.hidden = !older.length;
    older.forEach(function (s) {
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = fmt(s.ts);
      if (s.note) {
        var n = document.createElement("span");
        n.className = "note";
        n.textContent = s.note;
        span.appendChild(n);
      }
      var a = document.createElement("a");
      a.href = navUrl(s); a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Ir";
      li.appendChild(span); li.appendChild(a);
      ul.appendChild(li);
    });
  }

  /* Save spot */
  saveBtn.addEventListener("click", function () {
    if (!("geolocation" in navigator)) {
      setStatus("Este navegador no admite GPS.", true); return;
    }
    saveBtn.disabled = true;
    setStatus("Obteniendo posición GPS…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      var list = load();
      list.unshift({
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        acc: pos.coords.accuracy, ts: Date.now()
      });
      list = list.slice(0, MAX);
      /* Photos are kept only for the latest spot to save storage */
      list.forEach(function (s, i) { if (i > 0) delete s.photo; });
      $("note").value = "";
      if (store(list)) setStatus("Guardado. Puedes añadir una nota o una foto.");
      else setStatus("No se pudo guardar. Comprueba que el navegador permita el almacenamiento del sitio.", true);
      saveBtn.disabled = false;
      render();
    }, function (err) {
      var msg = "No se pudo obtener tu posición.";
      if (err.code === 1) msg = "Permiso de ubicación denegado. Permite la ubicación para este sitio en los ajustes de Chrome.";
      else if (err.code === 2) msg = "Posición no disponible. Activa el GPS e inténtalo de nuevo.";
      else if (err.code === 3) msg = "El GPS tardó demasiado. Sal a un lugar abierto e inténtalo de nuevo.";
      setStatus(msg, true);
      saveBtn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });

  /* Note */
  function saveNote() {
    var list = load();
    if (!list.length) return;
    list[0].note = $("note").value.trim();
    if (store(list)) setStatus("Nota guardada.");
    else setStatus("No se pudo guardar la nota. Comprueba el almacenamiento del navegador.", true);
    render();
  }
  $("saveNote").addEventListener("click", saveNote);
  $("note").addEventListener("change", saveNote);

  /* Photo */
  $("takePhoto").addEventListener("click", function () { $("photoInput").click(); });
  $("photoInput").addEventListener("change", function () {
    var input = $("photoInput");
    var f = input.files && input.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      var max = 800;
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(url);
      var list = load();
      if (list.length) {
        list[0].photo = data;
        if (store(list)) setStatus("Foto guardada.");
        else setStatus("No hay espacio suficiente en el navegador para la foto.", true);
      }
      input.value = "";
      render();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus("No se pudo leer esa foto.", true);
      input.value = "";
    };
    img.src = url;
  });
  $("removePhoto").addEventListener("click", function () {
    var list = load();
    if (list.length) { delete list[0].photo; store(list); }
    setStatus("Foto quitada.");
    render();
  });

  /* Navigate */
  $("go").addEventListener("click", function () {
    var list = load();
    if (list.length) window.open(navUrl(list[0]), "_blank");
  });

  /* Share */
  $("share").addEventListener("click", function () {
    var list = load();
    if (!list.length) return;
    var s = list[0];
    var text = "Mi auto está aquí: " + viewUrl(s) +
               (s.note ? " (" + s.note + ")" : "") + " - guardado el " + fmt(s.ts);
    if (navigator.share) {
      navigator.share({ title: "Mi auto", text: text }).catch(function () {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }
  });

  /* Live distance */
  $("distBtn").addEventListener("click", function () {
    if (watchId !== null) { stopWatch(); return; }
    var list = load();
    if (!list.length) return;
    if (!("geolocation" in navigator)) {
      setStatus("Este navegador no admite GPS.", true); return;
    }
    var spot = list[0];
    $("distBtn").textContent = "Detener distancia";
    $("dist").textContent = "Localizando…";
    watchId = navigator.geolocation.watchPosition(function (pos) {
      var m = meters(pos.coords.latitude, pos.coords.longitude, spot.lat, spot.lng);
      $("dist").textContent = fmtDist(m) + " de tu auto";
    }, function (err) {
      stopWatch();
      setStatus(err.code === 1 ? "Permiso de ubicación denegado." : "No se pudo obtener tu posición.", true);
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  });

  /* Clear */
  $("clear").addEventListener("click", function () {
    if (confirm("¿Borrar todos los lugares guardados?")) { stopWatch(); store([]); setStatus(""); render(); }
  });

  render();
})();
</script>
</body>
</html>
